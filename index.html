<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>韋瑞畫廊 v6.3</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: #f4f7f6; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 550px; margin-bottom: 15px; box-sizing: border-box; }
        h2, h3 { text-align: center; color: #2c3e50; margin-top: 0; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        .section { margin-bottom: 12px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #34495e; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #ccd1d9; border-radius: 8px; box-sizing: border-box; font-size: 16px; background: #fff; }
        .row { display: flex; gap: 8px; align-items: center; }
        .live-price-box { background: #fff; padding: 15px; border-radius: 10px; text-align: center; border: 2px dashed #e67e22; margin: 10px 0; }
        .live-price-val { font-size: 32px; font-weight: bold; color: #e67e22; }
        .btn-add { background: #27ae60; color: white; border: none; width: 100%; padding: 15px; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .btn-checkout { background: #2c3e50; color: white; border: none; width: 100%; padding: 15px; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .history-panel { background: #ecf0f1; padding: 15px; border-radius: 15px; width: 100%; max-width: 550px; margin-top: 20px; border: 1px solid #bdc3c7; }
        .history-item { background: #fff; padding: 10px; border-radius: 8px; margin-bottom: 10px; border-left: 5px solid #3498db; font-size: 13px; }
        .option-group { background:#fff9f0; padding:12px; border-radius:10px; border: 1px solid #ffe0b2; margin-top: 10px; }
        .hidden { display: none !important; }
        @media print { .no-print { display: none !important; } .card { box-shadow: none; border: none; width: 100%; } }
    </style>
</head>
<body>

<div class="card no-print">
    <h2>韋瑞畫廊 v6.3</h2>
    <div class="section" style="background: #fcfcfc; border: 1px solid #eee; padding: 15px; border-radius: 10px;">
        <label>👤 客戶資料</label>
        <div class="row" style="margin-bottom: 10px;"><input type="text" id="cust_name" placeholder="姓名"><input type="tel" id="cust_phone" placeholder="電話"></div>
        <div class="row">
            <div style="flex:1;"><label style="font-size:12px;">收件日期</label><input type="date" id="date_receive"></div>
            <div style="flex:1;"><label style="font-size:12px;">預計交件</label><input type="date" id="date_deliver"></div>
        </div>
    </div>
</div>

<div class="card no-print" id="inputSection">
    <h3>💰 報價計算</h3>
    <div class="section">
        <label>報價模式</label>
        <select id="mode" onchange="toggleMode()">
            <option value="normal" selected>國畫裝框 (周長計價)</option>
            <option value="oil">油畫裝框 (堆疊計價)</option>
            <option value="board">國畫裱板 (面積計價)</option>
            <option value="scroll">立軸掛軸</option>
        </select>
    </div>

    <div class="row">
        <div style="flex:1;"><label>畫心長</label><input type="number" id="L_in" oninput="runCalc()" inputmode="numeric"></div>
        <div style="flex:1;"><label>畫心寬</label><input type="number" id="W_in" oninput="runCalc()" inputmode="numeric"></div>
    </div>

    <div id="normal-options" class="option-group">
        <label>選擇框種</label>
        <select id="baseRate" onchange="runCalc()">
            <option value="250">國畫框 (250)</option>
            <option value="280">2寸特選手工框 (280)</option>
            <option value="300">3寸特選手工框 (300)</option>
            <option value="inner_outer">國畫內外框 (250)</option>
        </select>
        <div id="acyRow" style="margin-top:10px;"><label><input type="checkbox" id="addAcy" onchange="runCalc()"> 加壓克力 (120/才)</label></div>
    </div>

    <div id="oil-options" class="option-group hidden">
        <label>油畫施作方式</label>
        <select id="oilType" onchange="runCalc()">
            <option value="direct">直接框</option>
            <option value="solid">立體框</option>
            <option value="inout">內外框</option>
        </select>
    </div>

    <div class="section" style="margin-top:10px;">
        <label>📝 單項備註 (客製需求)</label>
        <input type="text" id="item_note" placeholder="例如：加金邊、特殊顏色...">
    </div>

    <div class="live-price-box">
        <div class="live-price-val">NT$ <span id="priceTxt">0</span></div>
        <div id="sizeDetail" style="font-size:13px; color:#7f8c8d;"></div>
    </div>
    <button class="btn-add" onclick="addItem()">＋ 加入報價清單</button>
</div>

<div class="card" id="cartSection">
    <h3>📝 報價清單</h3>
    <div id="printHeader" class="hidden"></div>
    <table style="width:100%;" id="cartTable"></table>
    <div style="text-align:right; font-size:20px; font-weight:bold; margin-top:10px; border-top:2px solid #333; padding-top:10px;">
        總計：NT$ <span id="totalTxt">0</span>
    </div>
    <div class="no-print">
        <button id="finalBtn" class="btn-checkout" onclick="processCheckout()">確認結單並存檔</button>
        <button id="resetBtn" class="btn-checkout hidden" style="background:#f39c12;" onclick="location.reload()">下一張新訂單</button>
    </div>
</div>

<div class="history-panel no-print">
    <h3>📂 歷史檔案庫</h3>
    <input type="text" id="searchKey" placeholder="搜尋姓名或電話..." oninput="searchHistory()" style="margin-bottom:15px;">
    <div id="historyList"></div>
</div>

<script>
    const TAI_TO_CM = 30.3;
    const TAI_TO_INCH = 11.93;
    let cart = [];
    let currentPrice = 0;

    function runCalc() {
        const mode = document.getElementById('mode').value;
        const L = (parseFloat(document.getElementById('L_in').value) || 0) / 100;
        const W = (parseFloat(document.getElementById('W_in').value) || 0) / 100;
        const tL = L + 1.0; const tW = W + 0.5;
        const Lcm = tL * TAI_TO_CM; const Wcm = tW * TAI_TO_CM;
        
        document.getElementById('sizeDetail').innerText = `尺寸：${Lcm.toFixed(1)}x${Wcm.toFixed(1)}cm`;

        if (mode === 'normal') {
            const base = document.getElementById('baseRate').value;
            if (base === 'inner_outer') {
                // 公式：(長+寬)*2*250 (含克力)
                currentPrice = Math.round((tL + tW) * 2 * 250);
                document.getElementById('acyRow').classList.add('hidden');
            } else {
                currentPrice = Math.round((tL + tW) * parseInt(base));
                document.getElementById('acyRow').classList.remove('hidden');
                if(document.getElementById('addAcy').checked) currentPrice += Math.round(tL * tW * 80);
            }
        }
        // ... (其餘模式計算邏輯)
        document.getElementById('priceTxt').innerText = currentPrice.toLocaleString();
    }

    function addItem() {
        if(currentPrice <= 0) return;
        const note = document.getElementById('item_note').value;
        cart.push({
            title: document.getElementById('mode').options[document.getElementById('mode').selectedIndex].text,
            price: currentPrice,
            spec: document.getElementById('sizeDetail').innerText,
            note: note ? `(備註：${note})` : ""
        });
        renderCart();
        document.getElementById('item_note').value = "";
    }

    function renderCart() {
        const table = document.getElementById('cartTable'); table.innerHTML = ""; let total = 0;
        cart.forEach((it, idx) => {
            total += it.price;
            table.innerHTML += `<tr><td style="padding:8px; border-bottom:1px solid #eee;"><b>${it.title}</b><br><small>${it.spec} ${it.note}</small></td><td align="right">${it.price.toLocaleString()}</td></tr>`;
        });
        document.getElementById('totalTxt').innerText = total.toLocaleString();
    }

    function processCheckout() {
        if(cart.length === 0) return;
        const order = {
            name: document.getElementById('cust_name').value || "未填",
            phone: document.getElementById('cust_phone').value || "未填",
            date: document.getElementById('date_receive').value,
            total: document.getElementById('totalTxt').innerText,
            items: cart
        };
        // 存入歷史紀錄 (LocalStorage)
        let history = JSON.parse(localStorage.getItem('weray_history')) || [];
        history.unshift(order);
        localStorage.setItem('weray_history', JSON.stringify(history.slice(0, 100))); // 保留前100筆
        
        alert("結案成功！資料已存入檔案庫。");
        document.getElementById('finalBtn').classList.add('hidden');
        document.getElementById('resetBtn').classList.remove('hidden');
        searchHistory();
    }

    function searchHistory() {
        const key = document.getElementById('searchKey').value.toLowerCase();
        const history = JSON.parse(localStorage.getItem('weray_history')) || [];
        const list = document.getElementById('historyList');
        list.innerHTML = "";
        
        history.filter(h => h.name.includes(key) || h.phone.includes(key)).forEach(h => {
            list.innerHTML += `
                <div class="history-item">
                    <b>${h.date} | ${h.name} (${h.phone})</b><br>
                    總額：NT$ ${h.total}<br>
                    <small>${h.items.map(i => i.title).join(", ")}</small>
                </div>`;
        });
    }

    function toggleMode() {
        const m = document.getElementById('mode').value;
        document.getElementById('normal-options').classList.toggle('hidden', m !== 'normal');
        document.getElementById('oil-options').classList.toggle('hidden', m !== 'oil');
        runCalc();
    }

    window.onload = function() {
        const d = new Date(); document.getElementById('date_receive').value = d.toISOString().split('T')[0];
        searchHistory();
    };
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>

<body>
    <script>
    // --- 雲端設定區 ---
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxIGJhbS903H3fPdj4GSmX2-KwkjCP_ZWv676VqWnbddhw2EbvKHxQ3yqHRFGsAx4J9/exec'; 

    // ... 承襲前面的 runCalc, addItem 邏輯 ...

    async function processCheckout() {
        if(cart.length === 0) return alert("報價單內沒有項目");
        
        const order = {
            name: document.getElementById('cust_name').value || "未填",
            phone: document.getElementById('cust_phone').value || "未填",
            date: document.getElementById('date_receive').value,
            total: document.getElementById('totalTxt').innerText,
            items: cart
        };

        // 1. 本地存檔 (用於快速查詢)
        let history = JSON.parse(localStorage.getItem('weray_history')) || [];
        history.unshift(order);
        localStorage.setItem('weray_history', JSON.stringify(history.slice(0, 100)));

        // 2. 雲端同步 (用於檔案庫與多台設備共用)
        try {
            const response = await fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors', // 解決瀏覽器安全性限制
                cache: 'no-cache',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(order)
            });
            alert("✅ 結案成功！資料已同步至雲端資料庫。");
        } catch (error) {
            console.error('雲端同步失敗:', error);
            alert("⚠️ 本地已存檔，但雲端同步失敗，請檢查網路。");
        }

        document.getElementById('finalBtn').classList.add('hidden');
        document.getElementById('resetBtn').classList.remove('hidden');
        searchHistory();
    }

    // ... 承襲後續的 searchHistory 邏輯 ...
</script>
</body>
</html>
